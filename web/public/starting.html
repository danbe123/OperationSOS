<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation SOS is starting</title>
<style>
/* The kiosk boot page: the Field palette, the box's own display face for its name, and nothing else.
   It held the vault greens, a palette the box no longer has, so the one screen a household sees
   before the app loads was the only dark green thing left in it. */
:root{--ground:#f3efe4;--ink:#1b1b1b;--ink-muted:#474740;--signal:#144e2b}
@font-face{font-family:'VT323';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/vt323-v18-latin-regular.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/inter-v20-latin-regular.woff2') format('woff2')}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:400 18px/1.5 'Inter',system-ui,-apple-system,sans-serif}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center}
h1{color:var(--signal);font:400 64px/1 'VT323','Courier New',monospace;letter-spacing:.06em;margin:0}
p{font-size:22px;margin:0}
#tries{color:var(--ink-muted);font-size:16px}
</style>
</head>
<body>
<main>
<h1>Operation SOS</h1>
<p id="msg">Starting…</p>
<p id="tries"></p>
</main>
<script>
(function () {
  var n = 0;
  function again() {
    document.getElementById('tries').textContent = n > 5 ? 'Still waiting for the box services (attempt ' + n + ')' : '';
    setTimeout(tick, 2000);
  }
  function tick() {
    n++;
    fetch('/api/status', { cache: 'no-store' }).then(function (r) {
      if (r.ok) { location.replace('/?kiosk=1'); } else { again(); }
    }).catch(again);
  }
  tick();
})();
</script>
</body>
</html>
